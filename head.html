<!-- Warm the connection to Adobe Edge Network so the Alloy analytics
     beacon + Target decision call don't pay DNS+TLS handshake cost.
     Applied globally because every EDS page calls Edge for analytics.
     Zero LHS impact — handshake doesn't compete with the LCP image. -->
<link rel="preconnect" href="https://edge.adobedc.net" crossorigin>
<link rel="dns-prefetch" href="https://edge.adobedc.net">

<!-- Preload the self-hosted Adobe Web SDK so it's in cache when
     initAnalytics runs in lazy phase. Saves ~300-500 ms on the
     analytics beacon + Target proposition arrival on every EDS
     page. fetchpriority="low" keeps the LCP image's bandwidth
     budget intact — preload only consumes leftover capacity. -->
<link rel="preload" as="script" href="/eds/scripts/vendor/alloy.min.js" fetchpriority="low">
